name: CI
"on":
  pull_request:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # global.json pins 8.0.0 + rollForward latestMinor; 8.0.0 itself is no longer downloadable
          dotnet-version: 8.0.x
      - run: dotnet build ApideckUnifySdk.sln
