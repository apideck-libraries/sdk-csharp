overlay: 1.0.0
info:
  title: C# SDK overlay
  version: 0.0.1
actions:
  # Speakeasy >= 1.79x generates `Value.ToString(System.Globalization.CultureInfo...)` in
  # open enums. An enum member named `System` (from the value "system") shadows the
  # `System` namespace and the SDK no longer compiles (CS1061), so every generation since
  # 1.791.4 has fallen back to that version. Rename the member until Speakeasy emits
  # `global::System`.
  - target: $["components"]["schemas"]["JournalEntriesFilter"]["properties"]["scope"]
    update:
      x-speakeasy-enums:
        - Manual
        - SystemValue
